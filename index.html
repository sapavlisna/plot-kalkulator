<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b4332">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plot">
  <title>Plot Kalkulátor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1b4332;
      --green: #2d6a4f;
      --green-light: #40916c;
      --green-pale: #d8f3dc;
      --accent: #f4a261;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6c757d;
      --danger: #e63946;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    header {
      background: var(--green-dark);
      color: white;
      padding: 20px 20px 16px;
      text-align: center;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
    header p  { font-size: 0.85rem; opacity: 0.75; margin-top: 4px; }

    main {
      flex: 1;
      padding: 20px 16px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"] {
      flex: 1;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      border: 2px solid #dee2e6;
      border-radius: 12px;
      padding: 12px 16px;
      outline: none;
      width: 100%;
      transition: border-color .15s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: var(--green-light); }

    .unit {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--muted);
    }

    .limits-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .limit-field label { margin-bottom: 4px; }

    .limit-field input {
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      width: 100%;
      outline: none;
      font-weight: 600;
      color: var(--text);
      -moz-appearance: textfield;
    }
    .limit-field input::-webkit-inner-spin-button,
    .limit-field input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .limit-field input:focus { border-color: var(--green-light); }

    .limits-labels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 4px;
    }
    .limits-labels span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    button.calc {
      display: block;
      width: 100%;
      background: var(--green);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      letter-spacing: 0.03em;
    }
    button.calc:active { background: var(--green-dark); transform: scale(.98); }

    /* Results */
    .result-hidden { display: none; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--green-pale);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--green-dark); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--green); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

    .stat.wide { grid-column: span 2; }

    .warn-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.9rem;
      color: #664d03;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }

    thead th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 2px solid #dee2e6;
    }

    tbody tr:nth-child(even) { background: #f8f9fa; }

    tbody td {
      padding: 10px 10px;
      font-size: 1rem;
    }

    tbody td:first-child { color: var(--muted); font-size: 0.85rem; }
    tbody td:last-child { font-weight: 700; font-size: 1.15rem; color: var(--green-dark); }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-secondary {
      flex: 1;
      background: #e9ecef;
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-secondary:active { background: #ced4da; }

    .error-box {
      background: #fce4ec;
      border: 2px solid var(--danger);
      border-radius: 12px;
      padding: 16px;
      color: var(--danger);
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <h1>Plot Kalkulátor</h1>
  <p>Rozteč sloupků na pásmu</p>
</header>

<main>
  <div class="card">
    <label>Délka plotu</label>
    <div class="input-row">
      <input type="number" id="delka" inputmode="decimal" placeholder="98" min="0.1" step="0.01">
      <span class="unit">m</span>
    </div>

    <div style="margin-top:18px">
      <div class="limits-labels">
        <span>Min rozteč</span>
        <span>Ideál</span>
        <span>Max rozteč</span>
      </div>
      <div class="limits-row">
        <div class="limit-field">
          <input type="number" id="minR" inputmode="decimal" value="2.6" step="0.1">
        </div>
        <div class="limit-field">
          <input type="number" id="idealR" inputmode="decimal" value="3.0" step="0.1">
        </div>
        <div class="limit-field">
          <input type="number" id="maxR" inputmode="decimal" value="3.3" step="0.1">
        </div>
      </div>
    </div>
  </div>

  <button class="calc" onclick="spocitej()">Spočítat</button>

  <div id="vysledek" class="result-hidden" style="margin-top:16px">
    <!-- filled by JS -->
  </div>
</main>

<footer>v1.0 · funguje offline</footer>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  function spocitej() {
    const delka  = parseFloat(document.getElementById('delka').value);
    const minR   = parseFloat(document.getElementById('minR').value);
    const ideal  = parseFloat(document.getElementById('idealR').value);
    const maxR   = parseFloat(document.getElementById('maxR').value);
    const el     = document.getElementById('vysledek');

    if (!delka || delka <= 0) {
      el.className = '';
      el.innerHTML = '<div class="card error-box">Zadej délku plotu v metrech.</div>';
      return;
    }
    if (minR >= maxR || ideal < minR || ideal > maxR) {
      el.className = '';
      el.innerHTML = '<div class="card error-box">Zkontroluj limity rozteče (min &lt; ideál &lt; max).</div>';
      return;
    }

    // Hledej počet mezer od -3 do +3 od ideálního odhadu
    const baseGaps = Math.round(delka / ideal);
    let candidates = [];

    for (let g = Math.max(1, baseGaps - 3); g <= baseGaps + 3; g++) {
      const s = delka / g;
      if (s >= minR && s <= maxR) {
        candidates.push({ gaps: g, spacing: s, diff: Math.abs(s - ideal) });
      }
    }

    el.className = '';

    if (candidates.length === 0) {
      // Nenašel platnou variantu — ukáž nejbližší možnosti
      let closest = [];
      for (let g = 1; g <= Math.ceil(delka / minR) + 1; g++) {
        const s = delka / g;
        closest.push({ gaps: g, spacing: s, diff: Math.abs(s - ideal) });
      }
      closest.sort((a, b) => a.diff - b.diff);
      const c1 = closest[0], c2 = closest[1];
      el.innerHTML = `
        <div class="card error-box">
          Pro ${delka} m nevychází rozteč do limitu ${minR}–${maxR} m.<br><br>
          Nejbližší možnosti:<br>
          &bull; ${c1.gaps} mezer → rozteč <strong>${c1.spacing.toFixed(3)} m</strong><br>
          &bull; ${c2.gaps} mezer → rozteč <strong>${c2.spacing.toFixed(3)} m</strong><br><br>
          Uprav limity nebo délku plotu.
        </div>`;
      return;
    }

    candidates.sort((a, b) => a.diff - b.diff);
    const best = candidates[0];
    const spacing = best.spacing;
    const gaps    = best.gaps;
    const posts   = gaps + 1;

    // Kumulativní body
    const body_na_pasmu = [];
    for (let i = 0; i <= gaps; i++) {
      body_na_pasmu.push(Math.round(i * spacing * 1000) / 1000);
    }

    // Varovani kdyz jsou dalsi validni varianty
    let warnHtml = '';
    if (candidates.length > 1) {
      const alts = candidates.slice(1, 3).map(c =>
        `${c.gaps} mezer → ${c.spacing.toFixed(3)} m`
      ).join(', &nbsp;');
      warnHtml = `<div class="warn-box">Alternativy: ${alts}</div>`;
    }

    const rows = body_na_pasmu.map((b, i) => `
      <tr>
        <td>${i === 0 ? 'Start' : i === gaps ? 'Konec' : `Sloupek ${i}`}</td>
        <td>${b.toFixed(2)} m</td>
      </tr>`).join('');

    el.innerHTML = `
      <div class="card">
        <div class="stats">
          <div class="stat">
            <div class="stat-value">${spacing.toFixed(2)}</div>
            <div class="stat-label">Rozteč (m)</div>
          </div>
          <div class="stat">
            <div class="stat-value">${posts}</div>
            <div class="stat-label">Sloupků (ks)</div>
          </div>
          <div class="stat wide">
            <div class="stat-value">${gaps}</div>
            <div class="stat-label">Počet mezer</div>
          </div>
        </div>
        ${warnHtml}
        <div class="table-wrap">
          <table>
            <thead><tr><th>Bod</th><th>Vzdálenost na pásmu</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="kopiruj()">Kopírovat seznam</button>
          <button class="btn-secondary" onclick="sdilej()">Sdílet</button>
        </div>
      </div>`;

    window._lastResult = { delka, spacing, posts, gaps, body_na_pasmu };
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function kopiruj() {
    if (!window._lastResult) return;
    const r = window._lastResult;
    const text = [
      `Plot ${r.delka} m | rozteč ${r.spacing.toFixed(2)} m | ${r.posts} sloupků`,
      '',
      ...r.body_na_pasmu.map((b, i) =>
        `${i === 0 ? 'Start' : i === r.gaps ? 'Konec' : `Sloupek ${i}`}: ${b.toFixed(2)} m`
      )
    ].join('\n');
    navigator.clipboard.writeText(text)
      .then(() => alert('Zkopírováno!'))
      .catch(() => alert('Kopírování selhalo.'));
  }

  function sdilej() {
    if (!window._lastResult) return;
    const r = window._lastResult;
    const text = `Plot ${r.delka} m\nRozteč: ${r.spacing.toFixed(2)} m\nSloupků: ${r.posts} ks\n\n` +
      r.body_na_pasmu.map((b, i) =>
        `${i === 0 ? 'Start' : i === r.gaps ? 'Konec' : `${i}.`}: ${b.toFixed(2)} m`
      ).join('\n');
    if (navigator.share) {
      navigator.share({ title: 'Plot Kalkulátor', text }).catch(() => {});
    } else {
      kopiruj();
    }
  }

  // Enter spustí výpočet
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') spocitej();
  });
</script>
</body>
</html>
