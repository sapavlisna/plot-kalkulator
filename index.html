<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#db2777">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plot">
  <title>Plot Kalkulátor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #9d174d;
      --green: #db2777;
      --green-light: #f472b6;
      --green-pale: #fce7f3;
      --accent: #c084fc;
      --bg: #fff5f8;
      --card: #ffffff;
      --text: #4a154b;
      --muted: #9b6a82;
      --danger: #e11d48;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='%23f9a8d4' fill-opacity='0.35'><path d='M15 12c-2.5 0-4.5 2-4.5 4.5 0 4 4.5 7 4.5 7s4.5-3 4.5-7C19.5 14 17.5 12 15 12z'/><path d='M45 32c-2.5 0-4.5 2-4.5 4.5 0 4 4.5 7 4.5 7s4.5-3 4.5-7c0-2.5-2-4.5-4.5-4.5z'/></g><g fill='%23fbcfe8' fill-opacity='0.45'><path d='M48 6c-1.5 0-3 1.2-3 3 0 2.5 3 4.5 3 4.5s3-2 3-4.5c0-1.8-1.5-3-3-3z'/><path d='M8 42c-1.5 0-3 1.2-3 3 0 2.5 3 4.5 3 4.5s3-2 3-4.5c0-1.8-1.5-3-3-3z'/></g></svg>");
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    header {
      background: linear-gradient(135deg, #db2777 0%, #c084fc 100%);
      color: white;
      padding: 20px 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
    header p  { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    header .version { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; letter-spacing: 0.05em; }
    header .icon { font-size: 2.4rem; line-height: 1; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }

    main {
      flex: 1;
      padding: 20px 16px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"] {
      flex: 1;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      border: 2px solid #dee2e6;
      border-radius: 12px;
      padding: 12px 16px;
      outline: none;
      width: 100%;
      transition: border-color .15s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: var(--green-light); }

    .unit {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--muted);
    }

    .limits-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .limit-field label { margin-bottom: 4px; }

    .limit-field input {
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      width: 100%;
      outline: none;
      font-weight: 600;
      color: var(--text);
      -moz-appearance: textfield;
    }
    .limit-field input::-webkit-inner-spin-button,
    .limit-field input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .limit-field input:focus { border-color: var(--green-light); }

    .limits-labels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 4px;
    }
    .limits-labels span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    button.calc {
      display: block;
      width: 100%;
      background: var(--green);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      letter-spacing: 0.03em;
    }
    button.calc:active { background: var(--green-dark); transform: scale(.98); }

    /* Results */
    .result-hidden { display: none; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--green-pale);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--green-dark); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--green); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

    .stat.wide { grid-column: span 2; }

    .warn-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.9rem;
      color: #664d03;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }

    thead th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 2px solid #dee2e6;
    }

    tbody tr:nth-child(even) { background: #f8f9fa; }

    tbody td {
      padding: 10px 10px;
      font-size: 1rem;
    }

    tbody td:first-child { color: var(--muted); font-size: 0.85rem; }
    tbody td:last-child { font-weight: 700; font-size: 1.15rem; color: var(--green-dark); }

    tbody tr { cursor: pointer; transition: background .12s; }
    tbody tr:active { background: #e9ecef; }
    tbody tr.anchor { background: var(--green-pale) !important; }
    tbody tr.anchor td:first-child { color: var(--green-dark); font-weight: 700; }
    tbody tr.anchor td:last-child { color: var(--green-dark); }

    .joke {
      display: block;
      font-size: 0.78rem;
      color: var(--green);
      font-style: italic;
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
      margin-top: 4px;
      line-height: 1.3;
    }

    .intro-joke {
      background: linear-gradient(135deg, #fce7f3, #fae8ff);
      border-left: 4px solid var(--green);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-style: italic;
      color: var(--green-dark);
      line-height: 1.4;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .offset-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #e9ecef;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .seg button {
      background: transparent;
      border: none;
      padding: 10px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .seg button.active {
      background: var(--green);
      color: white;
    }

    .preset-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .preset-btn {
      background: #e9ecef;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .preset-btn.active {
      background: var(--green-pale);
      border-color: var(--green);
      color: var(--green-dark);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-secondary {
      flex: 1;
      background: #e9ecef;
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-secondary:active { background: #ced4da; }

    .error-box {
      background: #fce4ec;
      border: 2px solid var(--danger);
      border-radius: 12px;
      padding: 16px;
      color: var(--danger);
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="icon">🦄</div>
  <h1>Plot Kalkulátor</h1>
  <p>Rozteč sloupků na pásmu</p>
  <p class="version">v1.0.10</p>
</header>

<main>
  <div class="card">
    <div class="seg" id="modeSeg">
      <button type="button" class="active" data-mode="plot" onclick="setMode('plot')">Plot</button>
      <button type="button" data-mode="podhrabovky" onclick="setMode('podhrabovky')">Podhrabovky</button>
    </div>

    <label>Délka plotu</label>
    <div class="input-row">
      <input type="number" id="delka" inputmode="decimal" placeholder="0" min="0.1" step="0.01">
      <span class="unit">m</span>
    </div>

    <div id="plotInputs" style="margin-top:18px">
      <div class="limits-labels">
        <span>Min rozteč</span>
        <span>Ideál</span>
        <span>Max rozteč</span>
      </div>
      <div class="limits-row">
        <div class="limit-field">
          <input type="number" id="minR" inputmode="decimal" value="2.6" step="0.1">
        </div>
        <div class="limit-field">
          <input type="number" id="idealR" inputmode="decimal" value="3.0" step="0.1">
        </div>
        <div class="limit-field">
          <input type="number" id="maxR" inputmode="decimal" value="3.3" step="0.1">
        </div>
      </div>
    </div>

    <div id="podhrabovkyInputs" style="margin-top:18px; display:none">
      <label>Šířka podhrabovky</label>
      <div class="preset-row">
        <button type="button" class="preset-btn active" data-w="2.5" onclick="setPodhrabovkaWidth(2.5)">2,5 m</button>
        <button type="button" class="preset-btn" data-w="3" onclick="setPodhrabovkaWidth(3)">3 m</button>
      </div>
      <div class="input-row" style="margin-top:10px">
        <input type="number" id="podW" inputmode="decimal" value="2.5" step="0.01" min="0.1" oninput="onPodWidthInput()">
        <span class="unit">m</span>
      </div>

      <label style="margin-top:16px">Zkrátit</label>
      <div class="seg" id="shortenSeg">
        <button type="button" class="active" data-side="last" onclick="setShortenSide('last')">Poslední</button>
        <button type="button" data-side="first" onclick="setShortenSide('first')">První</button>
      </div>
    </div>
  </div>

  <button class="calc" onclick="spocitej()">Spočítat</button>

  <div id="vysledek" class="result-hidden" style="margin-top:16px">
    <!-- filled by JS -->
  </div>
</main>

<footer>funguje offline</footer>

  function pickIntroJoke(delka) {
    const pool = [];
    if (delka < 10) pool.push(...INTRO_JOKES.tiny);
    else if (delka < 30) pool.push(...INTRO_JOKES.short);
    else if (delka < 70) pool.push(...INTRO_JOKES.medium);
    else if (delka < 150) pool.push(...INTRO_JOKES.long);
    else pool.push(...INTRO_JOKES.epic);
    pool.push(...INTRO_JOKES.any);
    const raw = randPick(pool);
    return raw
      .replace(/\{delka\}/g, String(+delka.toFixed(2)).replace('.', ','))
      .replace(/\{nick\}/g, randPick(NICKS));
  }

  function randPick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  const NICKS = [
    'Miláčku', 'Zlatíčko', 'Beruško', 'Broučku', 'Kočičko', 'Kocourku',
    'Sluníčko', 'Princezno', 'Lvičko', 'Kuřátko', 'Štístko', 'Hvězdičko',
    'Andílku', 'Květinko', 'Drahoušku', 'Veverko', 'Holčičko', 'Šmoulinko',
    'Berunko', 'Princátko', 'Šnečku',
  ];

  function fillTemplate(s, i, n) {
    const remaining = n - 1 - i;
    return s
      .replace(/\{nick\}/g, randPick(NICKS))
      .replace(/\{i\}/g, i)
      .replace(/\{done\}/g, i)
      .replace(/\{rem\}/g, remaining);
  }

  function makeJoke(i, n) {
    const remaining = n - 1 - i;
    const half = Math.floor((n - 1) / 2);
    let pool = null;
    if (i === 0) pool = JOKES.start;
    else if (i === n - 1) pool = JOKES.end;
    else if (i === half && n >= 6) pool = JOKES.half;
    else if (remaining === 1) pool = JOKES.one;
    else if (remaining === 2) pool = JOKES.two;
    else if (remaining === 3) pool = JOKES.three;
    else if (remaining === 5) pool = JOKES.five_left;
    else if (remaining === 10) pool = JOKES.ten_left;
    else if (i === 5) pool = JOKES.five_done;
    else if (i === 10) pool = JOKES.ten_done;
    else if (i === 15) pool = JOKES.fifteen_done;
    else if (i === 20) pool = JOKES.twenty_done;
    else if (i === 25) pool = JOKES.twentyfive_done;
    else if (i === 30) pool = JOKES.thirty_done;
    else if (i % 5 === 0) pool = JOKES.every_five;
    else if (Math.random() < 0.18) pool = JOKES.sprinkle;
    if (!pool) return null;
    return fillTemplate(randPick(pool), i, n);
  }

  function generateJokes(n) {
    const arr = new Array(n).fill(null);
    for (let i = 0; i < n; i++) arr[i] = makeJoke(i, n);
    return arr;
  }

  function setMode(m) {
    appMode = m;
    document.querySelectorAll('#modeSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === m)

    document.getElementById('podhrabovkyInputs').style.display = (m === 'podhrabovky') ? '' : 'none';

  function updatePodPresets() {
    const v = parseFloat(document.getElementById('podW').value);
    document.querySelectorAll('#podhrabovkyInputs .preset-btn').forEach(b =>
      b.classList.toggle('active', Math.abs(parseFloat(b.dataset.w) - v) < 1e-9)

    shortenSide = s;

  function spocitej() {
    const el = document.getElementById('vysledek');
    const delka = parseFloat(document.getElementById('delka').value);

    if (!delka || delka <= 0) {
      el.className = '';
      el.innerHTML = '<div class="card error-box">Zadej délku plotu v metrech.</div>';
      return;
    }

    if (appMode === 'podhrabovky') {
      spocitejPodhrabovky(delka, el);
      return;
    }

    const minR   = parseFloat(document.getElementById('minR').value);
    const ideal  = parseFloat(document.getElementById('idealR').value);
    const maxR   = parseFloat(document.getElementById('maxR').value);

    if (minR >= maxR || ideal < minR || ideal > maxR) {
      el.className = '';
      el.innerHTML = '<div class="card error-box">Zkontroluj limity rozteče (min &lt; ideál &lt; max).</div>';
      return;
    }

    // Hledej počet mezer od -3 do +3 od ideálního odhadu
    const baseGaps = Math.round(delka / ideal);
    let candidates = [];

    for (let g = Math.max(1, baseGaps - 3); g <= baseGaps + 3; g++) {
      const s = delka / g;
      if (s >= minR && s <= maxR) {
        candidates.push({ gaps: g, spacing: s, diff: Math.abs(s - ideal) });
      }
    }

    el.className = '';

    if (candidates.length === 0) {
      // Nenašel platnou variantu — ukáž nejbližší možnosti
      let closest = [];
      for (let g = 1; g <= Math.ceil(delka / minR) + 1; g++) {
        const s = delka / g;
        closest.push({ gaps: g, spacing: s, diff: Math.abs(s - ideal) });
      }
      closest.sort((a, b) => a.diff - b.diff);
      const c1 = closest[0], c2 = closest[1];
      el.innerHTML = `
        <div class="card error-box">
          Pro ${delka} m nevychází rozteč do limitu ${minR}–${maxR} m.<br><br>
          Nejbližší možnosti:<br>
          &bull; ${c1.gaps} mezer → rozteč <strong>${c1.spacing.toFixed(3)} m</strong><br>
          &bull; ${c2.gaps} mezer → rozteč <strong>${c2.spacing.toFixed(3)} m</strong><br><br>
          Uprav limity nebo délku plotu.
        </div>`;
      return;
    }

    candidates.sort((a, b) => a.diff - b.diff);
    const best = candidates[0];
    const spacing = best.spacing;
    const gaps    = best.gaps;
    const posts   = gaps + 1;

    // Varovani kdyz jsou dalsi validni varianty
    let warnHtml = '';
    if (candidates.length > 1) {
      const alts = candidates.slice(1, 3).map(c =>
        `${c.gaps} mezer → ${c.spacing.toFixed(3)} m`
      ).join(', &nbsp;');
      warnHtml = `<div class="warn-box">Alternativy: ${alts}</div>`;
    }

    const points = [];
    for (let i = 0; i <= gaps; i++) points.push(i * spacing);

    renderResult(el, {
      mode: 'plot',
      delka,
      points,
      stats: [
        { value: spacing.toFixed(2), label: 'Rozteč (m)' },
        { value: posts, label: 'Sloupků (ks)' },
        { value: gaps, label: 'Počet mezer', wide: true },
      ],
      warnHtml,
    });
  }

  function spocitejPodhrabovky(delka, el) {
    const s = parseFloat(document.getElementById('podW').value);
    if (!s || s <= 0) {
      el.className = '';
      el.innerHTML = '<div class="card error-box">Zadej platnou šířku podhrabovky.</div>';
      return;
    }
    const nFull = Math.floor(delka / s + 1e-9);
    const remainder = Math.max(0, delka - nFull * s);
    const hasShort = remainder > 1e-6;

    const points = [];
    if (!hasShort) {
      for (let i = 0; i <= nFull; i++) points.push(i * s);
    } else if (shortenSide === 'last') {
      for (let i = 0; i <= nFull; i++) points.push(i * s);
      points.push(delka);
    } else {
      points.push(0);
      points.push(remainder);
      for (let i = 1; i <= nFull; i++) points.push(remainder + i * s);
    }

    const segCount = points.length - 1;
    const stats = [
      { value: s.toFixed(2), label: 'Šířka (m)' },
      { value: segCount, label: 'Kusů (ks)' },
    ];
    if (hasShort) {
      stats.push({ value: remainder.toFixed(2), label: `Zkrácený kus (${shortenSide === 'last' ? 'poslední' : 'první'}) (m)`, wide: true });
    } else {
      stats.push({ value: '✓', label: 'Vychází přesně', wide: true });
    }

    renderResult(el, {
      mode: 'podhrabovky',
      delka,
      points,
      stats,
      warnHtml: '',
    });
  }

  function renderResult(el, data) {
    el.className = '';
    const statsHtml = data.stats.map(s =>
      `<div class="stat${s.wide ? ' wide' : ''}">
         <div class="stat-value">${s.value}</div>
         <div class="stat-label">${s.label}</div>
       </div>`
    ).join('');

    const hintText = data.mode === 'podhrabovky'
      ? 'Klikni na bod — od něj se pásmo začne počítat znovu od nuly. Předchozí body se nezmění.'
      : 'Klikni na sloupek — od něj se pásmo začne počítat znovu od nuly (jako bys posunul krátké pásmo). Předchozí sloupky se nezmění.';

    const intro = pickIntroJoke(data.delka);

    el.innerHTML = `
      <div class="card">
        <div class="intro-joke">${intro}</div>
        <div class="stats">${statsHtml}</div>
        ${data.warnHtml || ''}
        <div class="offset-hint" id="anchorHint">${hintText}</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Bod</th><th>Vzdálenost na pásmu</th></tr></thead>
            <tbody id="bodyRows"></tbody>
          </table>
        </div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="kopiruj()">Kopírovat seznam</button>
          <button class="btn-secondary" onclick="sdilej()">Sdílet</button>
        </div>
      </div>`;

    window._lastResult = {
      mode: data.mode,
      delka: data.delka,
      points: data.points,
      anchors: new Set(),
      hintText,
      jokes: generateJokes(data.points.length),
    };
    renderRows();
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function bodLabel(i, n) {
    if (i === 0) return 'Start';
    if (i === n - 1) return 'Konec';
    const r = window._lastResult;
    return (r && r.mode === 'podhrabovky') ? `Bod ${i}` : `Sloupek ${i}`;
  }

  function displayValueAt(i) {
    const r = window._lastResult;
    let base = 0;
    for (const a of r.anchors) {
      if (a <= i && a > base) base = a;
    }
    return r.points[i] - r.points[base];
  }

  function renderRows() {
    const r = window._lastResult;
    if (!r) return;
    const tbody = document.getElementById('bodyRows');
    if (!tbody) return;
    const n = r.points.length;
    let html = '';
    for (let i = 0; i < n; i++) {
      const v = displayValueAt(i);
      const cls = r.anchors.has(i) ? ' class="anchor"' : '';
      const joke = r.jokes && r.jokes[i];
      const labelHtml = joke
        ? `${bodLabel(i, n)}<span class="joke">${joke}</span>`
        : bodLabel(i, n);
      html += `<tr${cls} onclick="setAnchor(${i})"><td>${labelHtml}</td><td>${v.toFixed(2)} m</td></tr>`;
    }
    tbody.innerHTML = html;
    const hint = document.getElementById('anchorHint');
    if (hint) {
      hint.textContent = r.anchors.size === 0
        ? r.hintText
        : `Pásmo posunuto ${r.anchors.size}× — klikni znovu na zvýrazněný bod pro zrušení.`;
    }
  }

  function setAnchor(i) {
    const r = window._lastResult;
    if (!r) return;
    if (i === 0) return;
    if (r.anchors.has(i)) r.anchors.delete(i);
    else r.anchors.add(i);
    renderRows();
  }

  function buildListText() {
    const r = window._lastResult;
    const n = r.points.length;
    const lines = [];
    for (let i = 0; i < n; i++) {
      lines.push(`${bodLabel(i, n)}: ${displayValueAt(i).toFixed(2)} m`);
    }
    return lines;
  }

  function headerText(r) {
    const n = r.points.length;
    if (r.mode === 'podhrabovky') {
      return `Podhrabovky ${r.delka} m | ${n - 1} kusů`;
    }
    const spacing = n > 1 ? (r.points[1] - r.points[0]) : 0;
    return `Plot ${r.delka} m | rozteč ${spacing.toFixed(2)} m | ${n} sloupků`;
  }

  function kopiruj() {
    if (!window._lastResult) return;
    const r = window._lastResult;
    const text = [headerText(r), '', ...buildListText()].join('\n');
    navigator.clipboard.writeText(text)
      .then(() => alert('Zkopírováno!'))
      .catch(() => alert('Kopírování selhalo.'));
  }

  function sdilej() {
    if (!window._lastResult) return;
    const r = window._lastResult;
    const text = headerText(r) + '\n\n' + buildListText().join('\n');
    if (navigator.share) {
      navigator.share({ title: 'Plot Kalkulátor', text }).catch(() => {});
    } else {
      kopiruj();
    }
  }

  // Enter spustí výpočet
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') spocitej();
  });
</script>
</body>
</html>
